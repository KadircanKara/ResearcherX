[project]
name = "researcherx-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "openai>=1.54",
  "ddgs>=6.0",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pydantic>=2.9",
  "pydantic-settings>=2.7",
  "structlog>=24.4",
  "httpx>=0.27",
  "sse-starlette>=2.1",
  "limits>=5.0",
  "pgvector>=0.3",
  "pymupdf>=1.24",
  "pymupdf4llm>=1.27",
  # Structured chunking: the section-aware splitter runs INSIDE a section
  # (see app/services/structured_chunker.py). Standalone package, not the
  # LangChain framework.
  "langchain-text-splitters>=0.3",
  # app/local_rag — the database-free retrieval system. bm25s is the real
  # BM25 arm (numpy/scipy, no service to run) and PyStemmer is its stemmer;
  # index and query must share one, so it is a hard dependency rather than
  # bm25s's optional extra. numpy is declared explicitly because
  # app/local_rag uses it directly for the dense arm, not only through bm25s.
  "bm25s>=0.3",
  "PyStemmer>=2.2",
  "numpy>=1.26",
  # RAG tracing (app/core/observability.py): spans exported over OTLP/HTTP
  # to Langfuse, which ingests OTLP natively, so no Langfuse SDK.
  "opentelemetry-sdk~=1.44",
  "opentelemetry-exporter-otlp-proto-http~=1.44",
]

[project.optional-dependencies]
dev = ["ruff>=0.7", "pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "container: needs the latex-compiler service running (skipped by default in make test)",
]
addopts = "-m 'not container'"
