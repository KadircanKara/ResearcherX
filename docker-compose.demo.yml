# Public demo: layered on docker-compose.prod.yml.
#   docker compose -p researcherx-demo -f docker-compose.prod.yml -f docker-compose.demo.yml up -d --build
# Secrets come from the shell environment (a root-only env file on the VM,
# see deploy/RUNBOOK.md). Nothing secret lives in this file.
services:
  backend:
    environment:
      AUTH_MODE: supabase
      REQUIRE_AUTH: "true"
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      DEMO_MAX_USERS: "20"
      FEATURE_RESEARCH: "false"
      FEATURE_PAPER_URL: "false"
      FEATURE_SHARING: "false"
      FEATURE_MANUAL_PAPERS: "false"
      USER_MAX_PAPERS: "20"
      PAPER_PDF_MAX_BYTES: "26214400"
      USER_CHAT_TURNS_PER_DAY: "100"
      USER_LLM_ASSISTS_PER_DAY: "40"
      USER_INGESTS_PER_DAY: "40"
      GLOBAL_CHAT_TURNS_PER_DAY: "1000"
      LLM_BASE_URL: https://api.openai.com/v1
      LLM_MODEL: gpt-5-mini
      LLM_REASONING_EFFORT: low
      CHAT_ANSWER_MAX_TOKENS: "6000"
      # The prod file does not pass this through; without it reranking is
      # silently off.
      COHERE_API_KEY: ${COHERE_API_KEY:?COHERE_API_KEY is required}
      CORS_ORIGINS: https://${DEMO_DOMAIN:?DEMO_DOMAIN is required}
    # The compiler is reachable ONLY over the internal `latex` network.
    # rx-backend is the name Caddy uses (see Caddyfile.demo).
    networks:
      default:
        aliases: [rx-backend]
      latex:
  frontend:
    networks:
      default:
        aliases: [rx-frontend]
    build:
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY is required}
    image: researcherx-frontend:demo
  # Also the VM's shared edge proxy: other apps join the external `proxy`
  # network and drop a site file into /srv/edge/sites (deploy/RUNBOOK.md, 12).
  caddy:
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN:?DEMO_DOMAIN is required}
    volumes:
      - ./Caddyfile.demo:/etc/caddy/Caddyfile:ro
      - /srv/edge/sites:/etc/caddy/sites:ro
    networks:
      - default
      - proxy
  # Copied whole from docker-compose.yml: every key below is part of the
  # sandbox (see CLAUDE.md, "LaTeX is compiled in a separate container"). A
  # partial copy is a sandbox with a hole in it.
  latex-compiler:
    build:
      context: ./latex-compiler
    restart: unless-stopped
    # Docker's tini as PID 1, purely to REAP. A compile timeout kills the
    # engine's process group, but the grandchildren (sh -> pdflatex) are
    # re-parented to PID 1 as they die, and a plain python3 entrypoint never
    # waits on them: they linger as zombies, each holding a slot against
    # `pids_limit: 64`. Measured at 4/64 after a single timeout, so repeated
    # runaway documents exhaust the limit on zombies alone and every later
    # compile fails to fork.
    init: true
    read_only: true
    tmpfs:
      # Sized explicitly: an unbounded tmpfs mount reports the host's full
      # RAM (measured: 3.9G) regardless of mem_limit, so filling /tmp does
      # not fail one request -- it OOM-kills the container and every
      # concurrent compile with it. 1g is NOT sized against
      # MAX_EXTRACTED_BYTES (64MB in app.py) -- that cap is unreachable over
      # HTTP in the first place (see its own comment in app.py) and would be
      # the wrong number to size against even if it weren't, since inode
      # amplification (a 4096-byte page per file regardless of declared
      # size) is what actually drives tmpfs usage, not declared bytes. The
      # real driver is the 32MB wire cap (MAX_TAR_LENGTH) times worst-case
      # per-file page rounding, at up to 8 concurrent compiles, plus TeX
      # Live's own caches under /tmp (see the Dockerfile's ENV block).
      # Measured in-container at full 8-way concurrency: peak usage 250MB of
      # the 1024MB budget -- so 1g is generous headroom against that
      # measurement, not a computed minimum.
      - /tmp:size=1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 2g
    cpus: 2
    # NO env_file and NO environment: this container must never hold
    # DATABASE_URL, LLM_API_KEY or OWNER_API_KEY. That is the control that
    # makes `\input{/app/.env}` -- which survives every engine flag -- return
    # nothing worth having.
    networks:
      - latex

networks:
  latex:
    internal: true    # no egress: a compile cannot phone home with what it read
  # Shared with other apps on the VM; created once with `docker network create proxy`.
  proxy:
    external: true
