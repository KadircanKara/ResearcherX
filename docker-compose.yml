services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: researcherx
      POSTGRES_PASSWORD: researcherx
      POSTGRES_DB: researcherx
    # Host port intentionally not published — your local postgres owns 5432.
    # The backend reaches db via the docker network on the default port.
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researcherx"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    # Healthy only once the MODEL is present, not merely when the server is up —
    # backend must not start against an Ollama that cannot embed yet.
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q nomic-embed-text"]
      interval: 5s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  # One-shot: Ollama does not auto-pull. Exits once the model is cached in the
  # shared volume; on-failure restart covers racing the server's startup.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "nomic-embed-text"]
    restart: on-failure

  backend:
    build:
      context: ./backend
      target: dev
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://researcherx:researcherx@db:5432/researcherx
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  db_data:
  ollama_models:
