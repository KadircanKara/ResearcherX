services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: researcherx
      POSTGRES_PASSWORD: researcherx
      POSTGRES_DB: researcherx
    # Host port intentionally not published — your local postgres owns 5432.
    # The backend reaches db via the docker network on the default port.
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researcherx"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    # Healthy only once the MODEL is present, not merely when the server is up —
    # backend must not start against an Ollama that cannot embed yet.
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q nomic-embed-text"]
      interval: 5s
      timeout: 3s
      retries: 60
      # ~275 MB model pull can take longer than interval*retries (300s) on a
      # slow link; failing probes during the pull still count against
      # retries without this grace window, and depends_on: service_healthy
      # would fail the whole `up`.
      start_period: 120s
    restart: unless-stopped

  # One-shot: Ollama does not auto-pull. Exits once the model is cached in the
  # shared volume; on-failure restart covers racing the server's startup.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "nomic-embed-text"]
    restart: on-failure

  backend:
    build:
      context: ./backend
      target: dev
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://researcherx:researcherx@db:5432/researcherx
      # Pinned here (not just .env.example) so a .env predating this branch
      # can't silently unset them: nomic-embed-text requires prefixed
      # documents/queries, and the model name alone can't detect drift.
      # These override .env's copies for these two keys, which is
      # intentional — the model and its prefixes must never drift apart.
      #
      # `-` NOT `:-`: the default must apply only when the var is UNSET. Under
      # `:-` an explicitly-empty value also falls back to the nomic prefix, so
      # a provider that takes no prefixes (OpenAI text-embedding-3-small) could
      # not be configured at all — every vector would silently carry a
      # "search_document:" prefix that model never saw, with no error anywhere.
      EMBEDDING_DOCUMENT_PREFIX: ${EMBEDDING_DOCUMENT_PREFIX-search_document:}
      EMBEDDING_QUERY_PREFIX: ${EMBEDDING_QUERY_PREFIX-search_query:}
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - default
      - latex

  latex-compiler:
    build:
      context: ./latex-compiler
    # Docker's tini as PID 1, purely to REAP. A compile timeout kills the
    # engine's process group, but the grandchildren (sh -> pdflatex) are
    # re-parented to PID 1 as they die, and a plain python3 entrypoint never
    # waits on them: they linger as zombies, each holding a slot against
    # `pids_limit: 64`. Measured at 4/64 after a single timeout, so repeated
    # runaway documents exhaust the limit on zombies alone and every later
    # compile fails to fork.
    init: true
    read_only: true
    tmpfs:
      # Sized explicitly: an unbounded tmpfs mount reports the host's full
      # RAM (measured: 3.9G) regardless of mem_limit, so filling /tmp does
      # not fail one request -- it OOM-kills the container and every
      # concurrent compile with it. 1g leaves headroom above the 64MB
      # MAX_EXTRACTED_BYTES cap in app.py plus TeX Live's own caches under
      # /tmp (see the Dockerfile's ENV block) at the container's full 8-way
      # compile concurrency.
      - /tmp:size=1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 2g
    cpus: 2
    # NO env_file and NO environment: this container must never hold
    # DATABASE_URL, LLM_API_KEY or OWNER_API_KEY. That is the control that
    # makes `\input{/app/.env}` -- which survives every engine flag -- return
    # nothing worth having.
    networks:
      - latex

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  db_data:
  ollama_models:

networks:
  default:
  latex:
    internal: true    # no egress: a compile cannot phone home with what it read
