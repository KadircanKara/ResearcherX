services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: researcherx
      POSTGRES_PASSWORD: researcherx
      POSTGRES_DB: researcherx
    # Host port intentionally not published — your local postgres owns 5432.
    # The backend reaches db via the docker network on the default port.
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researcherx"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    # Healthy only once the MODEL is present, not merely when the server is up —
    # backend must not start against an Ollama that cannot embed yet.
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q nomic-embed-text"]
      interval: 5s
      timeout: 3s
      retries: 60
      # ~275 MB model pull can take longer than interval*retries (300s) on a
      # slow link; failing probes during the pull still count against
      # retries without this grace window, and depends_on: service_healthy
      # would fail the whole `up`.
      start_period: 120s
    restart: unless-stopped

  # One-shot: Ollama does not auto-pull. Exits once the model is cached in the
  # shared volume; on-failure restart covers racing the server's startup.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "nomic-embed-text"]
    restart: on-failure

  backend:
    build:
      context: ./backend
      target: dev
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://researcherx:researcherx@db:5432/researcherx
      # Pinned here (not just .env.example) so a .env predating this branch
      # can't silently unset them: nomic-embed-text requires prefixed
      # documents/queries, and the model name alone can't detect drift.
      # These override .env's copies for these two keys, which is
      # intentional — the model and its prefixes must never drift apart.
      #
      # `-` NOT `:-`: the default must apply only when the var is UNSET. Under
      # `:-` an explicitly-empty value also falls back to the nomic prefix, so
      # a provider that takes no prefixes (OpenAI text-embedding-3-small) could
      # not be configured at all — every vector would silently carry a
      # "search_document:" prefix that model never saw, with no error anywhere.
      EMBEDDING_DOCUMENT_PREFIX: ${EMBEDDING_DOCUMENT_PREFIX-search_document:}
      EMBEDDING_QUERY_PREFIX: ${EMBEDDING_QUERY_PREFIX-search_query:}
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  db_data:
  ollama_models:
